# GPU Spend Guard Configuration
# Copy to /etc/gpu-spend-guard/config.yaml or ~/.config/gpu-spend-guard/config.yaml

# Alert thresholds (USD per hour)
thresholds:
  # Per-GPU alerts
  gpu_hourly_warn: 0.50      # Warn when any GPU exceeds $0.50/hr
  gpu_hourly_critical: 1.00  # Critical alert when any GPU exceeds $1.00/hr
  
  # Aggregate alerts
  total_hourly_warn: 2.00    # Warn when total lab spend exceeds $2.00/hr
  total_hourly_critical: 5.00 # Critical when total exceeds $5.00/hr
  
  # Daily budget
  daily_budget_warn: 20.00   # Warn at 80% of daily budget
  daily_budget_critical: 25.00 # Critical at 100% of daily budget
  
  # Monthly budget
  monthly_budget_warn: 400.00  # Warn at 80% of monthly budget
  monthly_budget_critical: 500.00 # Critical at 100% of monthly budget

# GPU pricing (USD/hour) - adjust for your hardware
gpu_pricing:
  "V100": 0.45
  "P40": 0.35
  "A100-40GB": 1.20
  "A100-80GB": 1.80
  "H100": 4.50
  "RTX-3090": 0.25
  "RTX-4090": 0.35
  "default": 0.50

# Notification channels
notifications:
  # Telegram (create bot via @BotFather, get chat_id via @userinfobot)
  telegram:
    enabled: true
    bot_token: "YOUR_BOT_TOKEN_HERE"
    chat_id: "YOUR_CHAT_ID_HERE"
    parse_mode: "HTML"
  
  # Discord (create webhook in Server Settings → Integrations → Webhooks)
  discord:
    enabled: true
    webhook_url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    username: "GPU Spend Guard"
    avatar_url: ""
  
  # Email (SMTP)
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    username: "your-email@gmail.com"
    password: "your-app-password"
    from_addr: "GPU Spend Guard <alerts@yourdomain.com>"
    to_addrs:
      - "you@example.com"

# Schedule
schedule:
  check_interval_seconds: 60      # How often to check GPU metrics
  summary_interval_hours: 24      # Daily summary frequency
  summary_time: "08:00"           # When to send daily summary (local time)
  timezone: "America/Toronto"

# Metrics sources
metrics:
  # Prometheus query for GPU utilization
  prometheus_url: "http://localhost:9090"
  gpu_util_query: 'avg by (gpu) (DCGM_FI_DEV_GPU_UTIL)'
  gpu_memory_query: 'avg by (gpu) (DCGM_FI_DEV_FB_USED / DCGM_FI_DEV_FB_TOTAL * 100)'
  
  # Alternative: nvidia-smi parsing (no Prometheus needed)
  use_nvidia_smi: true
  nvidia_smi_interval: 30

# Alert deduplication
dedup:
  warn_cooldown_minutes: 15
  critical_cooldown_minutes: 5
  summary_dedup_hours: 24

# Logging
logging:
  level: "INFO"
  file: "/var/log/gpu-spend-guard.log"
  max_bytes: 10485760
  backup_count: 5